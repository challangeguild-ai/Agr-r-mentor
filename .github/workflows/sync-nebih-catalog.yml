name: Nébih HU katalógus snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '25 4 * * 1'

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forrás metaadat frissítése
        shell: bash
        run: |
          mkdir -p data/official/nebih
          cat > data/official/nebih/metadata.txt <<EOF
          source=NEBIH public plant protection sources
          checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          product_database=https://novenyvedoszer.nebih.gov.hu/engedelykereso/Kereso
          active_ingredients=https://portal.nebih.gov.hu/hu/novenyvedo-szer-hatoanyag-lista
          mode=controlled_snapshot
          note=Only source-verifiable data may be marked official; current authorization document remains authoritative.
          EOF
      - name: Változás commitolása
        shell: bash
        run: |
          git config user.name 'agrar-mentor-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/official/nebih/metadata.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: Nébih HU snapshot ellenőrzési metaadat'
          git push
