name: Agrár Mentor Android – ellenőrzés és debug APK

on:
  push:
    branches:
      - feat/agrarmentor-android-native
    paths:
      - 'android/**'
      - '.github/workflows/agrarmentor-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    name: Android SDK 36 · teszt és debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Android 36 platform és build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle wrapper engedélyezése
        run: chmod +x ./gradlew

      - name: Natív Kotlin tesztek és debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Debug APK megőrzése
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Agrar-Mentor-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
