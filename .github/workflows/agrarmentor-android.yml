name: Agrár Mentor Android – fejlesztői ellenőrzés

on:
  push:
    branches:
      - feat/agrarmentor-android-native
    paths:
      - 'android/**'
      - '.github/workflows/agrarmentor-android.yml'
      - '.github/workflows/agrarmentor-android-release.yml'
      - 'scripts/android-release-guards.mjs'
      - 'scripts/check-android-production-gates.sql'
      - 'scripts/release-targets.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    name: Android SDK 36 · Kotlin teszt és fordítás
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Android 36 platform és build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle wrapper engedélyezése
        run: chmod +x ./gradlew

      - name: Natív Kotlin tesztek és ellenőrző fordítás
        # The unsigned release is compiled and tested but NEVER uploaded here.
        # Only the protected, signed, manually approved workflow may publish an APK.
        run: ./gradlew --no-daemon testDebugUnitTest testReleaseUnitTest assembleDebug assembleRelease
